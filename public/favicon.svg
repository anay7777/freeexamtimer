<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #ffffff;
        --fg: #000000;
      }
    }
  </style>
  <rect width="512" height="512" rx="115" fill="var(--bg)"/>
  <!-- Top left bell -->
  <line x1="168" y1="126" x2="112" y2="182" stroke="var(--fg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Top right bell -->
  <line x1="344" y1="126" x2="400" y2="182" stroke="var(--fg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Bottom left leg -->
  <line x1="170" y1="355" x2="138" y2="387" stroke="var(--fg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Bottom right leg -->
  <line x1="342" y1="355" x2="374" y2="387" stroke="var(--fg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Dial circle -->
  <circle cx="256" cy="270" r="114" fill="none" stroke="var(--fg)" stroke-width="32"/>
  <!-- Hands -->
  <path d="M256 205 V270 L292 304" fill="none" stroke="var(--fg)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
